[project]
name = "duplicacy-mcp"
version = "0.1.0"
description = "MCP server for duplicacy-web (backup administration: storages, repositories, schedules, jobs)"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "mcp>=2,<3",
    "httpx2>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duplicacy_mcp"]

[project.scripts]
duplicacy-mcp = "duplicacy_mcp.server:main"
